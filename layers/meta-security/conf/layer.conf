# Yocto layer configuration: meta-security

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "security"
BBFILE_PATTERN_security := "^${LAYERDIR}/"
BBFILE_PRIORITY_security = "9"

LAYERSERIES_COMPAT_security = "kirkstone langdale mickledore nanbield scarthgap"
