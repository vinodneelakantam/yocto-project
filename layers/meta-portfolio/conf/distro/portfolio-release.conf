# Portfolio distro variant: release
#
# Baseline for a shippable image: no interactive debug tooling, packages are
# stripped/split as normal, and "portfolio-secure" builds directly on top of
# this file. See docs/architecture.md for the full variant comparison.

require conf/distro/poky.conf

DISTRO = "portfolio-release"
DISTRO_NAME = "Portfolio Release Distro"
DISTRO_VERSION = "1.0-release"
DISTRO_CODENAME = "portfolio-release"

# Remove debug tooling regardless of what local.conf's EXTRA_IMAGE_FEATURES
# sets — a release build must not depend on the developer's local.conf.
EXTRA_IMAGE_FEATURES:remove = "debug-tweaks tools-debug"
IMAGE_FEATURES:remove = "debug-tweaks tools-debug dbg-pkgs ptest-pkgs"

# Full stripping/splitting of debug symbols (the poky.conf default, restated
# explicitly so this variant does not depend on inherited defaults).
INHIBIT_PACKAGE_STRIP = "0"
INHIBIT_PACKAGE_DEBUG_SPLIT = "0"
