# Portfolio distro variant: debug
#
# Optimized for local development and CI diagnosis: interactive root shell,
# debug symbols retained, ptest packages installed, and standard debug
# tooling (strace/gdb). Not suitable for a release or production artifact.
# See docs/architecture.md for the full variant comparison.

require conf/distro/poky.conf

DISTRO = "portfolio-debug"
DISTRO_NAME = "Portfolio Debug Distro"
DISTRO_VERSION = "1.0-debug"
DISTRO_CODENAME = "portfolio-debug"

# Interactive root shell (empty root password, auto root login) + strace/gdb
# + ptest packages.
EXTRA_IMAGE_FEATURES:append = " debug-tweaks tools-debug ssh-server-openssh"
IMAGE_FEATURES:append = " dbg-pkgs ptest-pkgs"

# Keep full debug symbols instead of stripping/splitting them out.
INHIBIT_PACKAGE_STRIP = "1"
INHIBIT_PACKAGE_DEBUG_SPLIT = "1"
