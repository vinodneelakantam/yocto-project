# Portfolio distro variant: secure
#
# Builds on portfolio-release with a reduced runtime attack surface:
# read-only root filesystem, PAM enabled, and the meta-security hardening
# packagegroup installed by default. This is a hardening baseline, not a
# substitute for the signed-OTA/secure-boot work tracked separately (see
# docs/resume-gap-roadmap.md, YP-108). See docs/architecture.md for the full
# variant comparison and docs/security-and-ota.md for the broader security
# model.

require conf/distro/portfolio-release.conf

DISTRO = "portfolio-secure"
DISTRO_NAME = "Portfolio Secure Distro"
DISTRO_VERSION = "1.0-secure"
DISTRO_CODENAME = "portfolio-secure"

# Read-only rootfs blocks runtime tampering with the deployed filesystem.
EXTRA_IMAGE_FEATURES:append = " read-only-rootfs"

# Enable PAM so hardening policy (layers/meta-security) can apply
# pluggable-auth-module based restrictions.
DISTRO_FEATURES:append = " pam"

# Install the hardening packagegroup from layers/meta-security by default.
IMAGE_INSTALL:append = " yocto-security-hardening"
