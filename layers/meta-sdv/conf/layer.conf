# Yocto layer configuration: meta-sdv
#
# Software-Defined-Vehicle applications built with Bazel.  Mirrors the priority
# and compatibility conventions used by meta-portfolio in this repository.

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sdv"
BBFILE_PATTERN_sdv := "^${LAYERDIR}/"
BBFILE_PRIORITY_sdv = "9"

LAYERSERIES_COMPAT_sdv = "kirkstone langdale mickledore nanbield scarthgap"

# This layer ships a Bazel-driven recipe.  Bazel is provided on the build host
# (devcontainer / worker) by scripts/bootstrap-worker-packages.sh rather than
# as a Yocto-native dependency.
LAYERDEPENDS_sdv = "core openembedded-layer"
