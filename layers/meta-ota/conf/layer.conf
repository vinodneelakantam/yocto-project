# Yocto layer configuration: meta-ota

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ota"
BBFILE_PATTERN_ota := "^${LAYERDIR}/"
BBFILE_PRIORITY_ota = "10"

LAYERSERIES_COMPAT_ota = "kirkstone langdale mickledore nanbield scarthgap"
