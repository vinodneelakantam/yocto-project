name: Yocto Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image:
        description: "BitBake image target"
        required: false
        default: "core-image-minimal"
      clean:
        description: "Run bitbake -c cleansstate before build"
        required: false
        default: "false"

jobs:
  local-build:
    # Runs on a GitHub-hosted runner (ubuntu-latest).
    # All Yocto build dependencies are installed at the start of the job via
    # scripts/bootstrap-worker-packages.sh.
    #
    # For local development, use the devcontainer in .devcontainer/ which has
    # all tools pre-installed in a Codespace or VS Code Dev Container.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 360
    env:
      IMAGE_TARGET: ${{ github.event.inputs.image || 'core-image-minimal' }}
      CLEAN_BUILD: ${{ github.event.inputs.clean || 'false' }}
      BOOTSTRAP_PACKAGES: "true"
      YOCTO_CENTRAL_CACHE_RSYNC: ${{ secrets.YOCTO_CENTRAL_CACHE_RSYNC }}

    steps:
      - name: Free up disk space
        # GitHub-hosted runners ship with ~14 GB free. Yocto builds need 50+ GB.
        # Removing unused pre-installed toolchains recovers ~30 GB.
        run: |
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Yocto downloads cache
        # DL_DIR: source tarballs fetched by BitBake — rarely change, huge time saver.
        uses: actions/cache@v4
        with:
          path: .cache/yocto/downloads
          key: yocto-dl-${{ runner.os }}-${{ hashFiles('.gitmodules', 'conf/**') }}
          restore-keys: |
            yocto-dl-${{ runner.os }}-

      - name: Restore Yocto sstate cache
        # SSTATE_DIR: incremental build artefacts — avoids recompiling unchanged packages.
        # Key is scoped to recipe files only (.bb/.bbappend/.bbclass) so documentation
        # or README changes inside layers do not trigger unnecessary cache invalidation.
        uses: actions/cache@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-${{ runner.os }}-${{ env.IMAGE_TARGET }}-${{ hashFiles('.gitmodules', 'conf/**', 'layers/**/*.bb', 'layers/**/*.bbappend', 'layers/**/*.bbclass') }}
          restore-keys: |
            yocto-sstate-${{ runner.os }}-${{ env.IMAGE_TARGET }}-
            yocto-sstate-${{ runner.os }}-

      - name: Run Yocto build
        # bootstrap-worker-packages.sh installs all Yocto host tools before
        # the build starts (controlled by BOOTSTRAP_PACKAGES=true above).
        run: |
          set -euo pipefail
          chmod +x scripts/local-build.sh scripts/remote-build.sh \
            scripts/bootstrap-worker-packages.sh scripts/devcontainer-sanity-check.sh
          ./scripts/local-build.sh "$IMAGE_TARGET" "$CLEAN_BUILD"

      - name: Collect local artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp -a out/. artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-images-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error
