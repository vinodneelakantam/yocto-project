name: Yocto Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image:
        description: "BitBake image target"
        required: false
        default: "core-image-minimal"
      clean:
        description: "Run bitbake -c cleansstate before build"
        required: false
        default: "false"

jobs:
  local-build:
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    env:
      IMAGE_TARGET: ${{ github.event.inputs.image || 'core-image-minimal' }}
      CLEAN_BUILD: ${{ github.event.inputs.clean || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Yocto build on same node
        shell: bash
        env:
          YOCTO_CENTRAL_CACHE_RSYNC: ${{ secrets.YOCTO_CENTRAL_CACHE_RSYNC }}
        run: |
          set -euo pipefail
          chmod +x scripts/local-build.sh scripts/remote-build.sh scripts/bootstrap-worker-packages.sh scripts/devcontainer-sanity-check.sh
          ./scripts/local-build.sh "$IMAGE_TARGET" "$CLEAN_BUILD"

      - name: Collect local artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp -a out/. artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-images-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error
