name: Yocto Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image:
        description: "BitBake image target"
        required: false
        default: "core-image-minimal"
      clean:
        description: "Run bitbake -c cleansstate before build"
        required: false
        default: "false"

jobs:
  local-build:
    # Runs on a standard GitHub-hosted runner inside the repo's devcontainer image
    # (same environment as the Codespace prebuild — no tool reinstall needed).
    # For larger Yocto images, swap to a bigger runner e.g. ubuntu-latest-16-cores.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write  # push devcontainer image layers to GHCR for caching
    env:
      IMAGE_TARGET: ${{ github.event.inputs.image || 'core-image-minimal' }}
      CLEAN_BUILD: ${{ github.event.inputs.clean || 'false' }}
      BOOTSTRAP_PACKAGES: "false"  # tools are already baked into the devcontainer image
      YOCTO_CENTRAL_CACHE_RSYNC: ${{ secrets.YOCTO_CENTRAL_CACHE_RSYNC }}

    steps:
      - name: Free up disk space
        # Removes large pre-installed tools (~30 GB) so Yocto has enough room to build.
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Yocto downloads cache
        # DL_DIR: source tarballs fetched by BitBake — rarely change, huge time saver.
        uses: actions/cache@v4
        with:
          path: .cache/yocto/downloads
          key: yocto-dl-${{ runner.os }}-${{ hashFiles('.gitmodules', 'conf/**') }}
          restore-keys: |
            yocto-dl-${{ runner.os }}-

      - name: Restore Yocto sstate cache
        # SSTATE_DIR: incremental build artefacts — avoids recompiling unchanged packages.
        # Key is scoped to recipe files only (.bb/.bbappend/.bbclass) so documentation
        # or README changes inside layers do not trigger unnecessary cache invalidation.
        uses: actions/cache@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-${{ runner.os }}-${{ env.IMAGE_TARGET }}-${{ hashFiles('.gitmodules', 'conf/**', 'layers/**/*.bb', 'layers/**/*.bbappend', 'layers/**/*.bbclass') }}
          restore-keys: |
            yocto-sstate-${{ runner.os }}-${{ env.IMAGE_TARGET }}-
            yocto-sstate-${{ runner.os }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Yocto build in devcontainer
        # Uses the same devcontainer image as the Codespace prebuild.
        # The built image is pushed to GHCR and reused as a Docker layer cache on
        # subsequent runs — so the container is not rebuilt from scratch each time.
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          env: |
            BOOTSTRAP_PACKAGES
            YOCTO_CENTRAL_CACHE_RSYNC
            IMAGE_TARGET
            CLEAN_BUILD
          runCmd: |
            set -euo pipefail
            chmod +x scripts/local-build.sh scripts/remote-build.sh \
              scripts/bootstrap-worker-packages.sh scripts/devcontainer-sanity-check.sh
            ./scripts/local-build.sh "$IMAGE_TARGET" "$CLEAN_BUILD"

      - name: Collect local artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp -a out/. artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-images-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error
