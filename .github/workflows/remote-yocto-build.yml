name: Yocto Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image:
        description: "BitBake image target"
        required: false
        default: "core-image-minimal"
      clean:
        description: "Run bitbake -c cleansstate before build"
        required: false
        default: "false"
      run_codespace:
        description: "Also run the Codespace self-hosted job (requires an active Codespace runner)"
        type: boolean
        required: false
        default: false
      variant:
        description: "Build variant override for the primary build (debug, release, secure). Leave empty to keep local.conf's default DISTRO."
        required: false
        default: ""
      build_all_variants:
        description: "Also run the debug/release/secure matrix build (manual dispatch only, see docs/architecture.md)"
        type: boolean
        required: false
        default: false

# Only one Yocto build runs at a time on main.  If a new push arrives while
# a build is already running, the in-flight run is cancelled so the latest
# commit always builds with a warm cache from the previous completed run.
concurrency:
  group: yocto-build-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level defaults — jobs inherit these and can override.
env:
  IMAGE_TARGET: ${{ inputs.image || 'core-image-minimal' }}
  CLEAN_BUILD: ${{ inputs.clean || 'false' }}
  BUILD_VARIANT: ${{ inputs.variant || '' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 0 — Ensure the GHCR build image exists.
  #
  # Checks whether ghcr.io/<owner>/yocto-build-env:latest is present in the
  # registry.  If it is missing (e.g. first run, registry purge) the job
  # builds and pushes it from the devcontainer Dockerfile before any build
  # job attempts to pull it.  Subsequent runs skip the build step entirely.
  # ─────────────────────────────────────────────────────────────────────────
  ensure-build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed only when the image must be pushed

    steps:
      # Checkout is required before the image check so that hashFiles() can
      # compute the Dockerfile digest used for the versioned image tag.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether build image already exists
        # Use a versioned tag derived from the Dockerfile content hash so that
        # any change to the Dockerfile automatically triggers a rebuild — even
        # when the `latest` tag already exists.
        id: image-check
        run: |
          if docker manifest inspect \
              "ghcr.io/${{ github.repository_owner }}/yocto-build-env:sha-${{ hashFiles('.devcontainer/Dockerfile') }}" \
              > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image-check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push missing image
        if: steps.image-check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          # Push both the versioned tag (used by the existence check above) and
          # `latest` (used by the remote-build docker pull).
          tags: |
            ghcr.io/${{ github.repository_owner }}/yocto-build-env:latest
            ghcr.io/${{ github.repository_owner }}/yocto-build-env:sha-${{ hashFiles('.devcontainer/Dockerfile') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Job 1 — Codespace / self-hosted local build (opt-in).
  #
  # Only runs on manual dispatch when run_codespace=true, so the workflow
  # does not stay queued indefinitely when no Codespace runner is active.
  #
  # One-time Codespace runner setup:
  #   mkdir ~/actions-runner && cd ~/actions-runner
  #   curl -fsSL https://github.com/actions/runner/releases/latest/download/actions-runner-linux-x64.tar.gz | tar xz
  #   ./config.sh --url https://github.com/vinodneelakantam/yocto-project \
  #               --token <Settings → Actions → Runners → New self-hosted runner> \
  #               --labels codespace-yocto --name codespace-runner --unattended
  #   ./run.sh &
  # ─────────────────────────────────────────────────────────────────────────
  local-build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_codespace == true }}
    runs-on: [self-hosted, linux, codespace-yocto]
    timeout-minutes: 360
    env:
      # Tools are pre-installed in the devcontainer image — skip apt bootstrap.
      BOOTSTRAP_PACKAGES: "false"
      YOCTO_CENTRAL_CACHE_RSYNC: ${{ secrets.YOCTO_CENTRAL_CACHE_RSYNC }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture submodule revision hash
        # Hash all pinned submodule commit SHAs so the cache key is sensitive
        # to upstream layer pin changes, not just .gitmodules path/URL changes.
        id: sub-hash
        run: |
          echo "rev=$(git submodule status | awk '{print $1}' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Yocto downloads cache
        uses: actions/cache@v4
        with:
          path: .cache/yocto/downloads
          key: yocto-dl-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('conf/**') }}
          restore-keys: |
            yocto-dl-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-dl-${{ runner.os }}-

      # ── sstate restore: per-layer keys ────────────────────────────────────
      - name: Restore upstream sstate cache (poky / meta-oe)
        uses: actions/cache/restore@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-upstream-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('conf/**') }}
          restore-keys: |
            yocto-sstate-upstream-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-sstate-upstream-${{ runner.os }}-

      - name: Restore meta-portfolio sstate cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-portfolio-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-portfolio/**/*.bb', 'layers/meta-portfolio/**/*.bbappend', 'layers/meta-portfolio/**/*.bbclass') }}
          restore-keys: |
            yocto-sstate-meta-portfolio-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-sstate-meta-portfolio-${{ runner.os }}-

      - name: Restore meta-security sstate cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-security-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-security/**/*.bb', 'layers/meta-security/**/*.bbappend', 'layers/meta-security/**/*.bbclass') }}
          restore-keys: |
            yocto-sstate-meta-security-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-sstate-meta-security-${{ runner.os }}-

      - name: Restore meta-ota sstate cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-ota-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-ota/**/*.bb', 'layers/meta-ota/**/*.bbappend', 'layers/meta-ota/**/*.bbclass') }}
          restore-keys: |
            yocto-sstate-meta-ota-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-sstate-meta-ota-${{ runner.os }}-
      # ──────────────────────────────────────────────────────────────────────

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Run Yocto build
        run: |
          set -euo pipefail
          chmod +x scripts/local-build.sh scripts/remote-build.sh \
            scripts/bootstrap-worker-packages.sh scripts/devcontainer-sanity-check.sh
          ./scripts/local-build.sh "$IMAGE_TARGET" "$CLEAN_BUILD"

      # ── sstate save: one entry per layer ──────────────────────────────────
      - name: Save upstream sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-upstream-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('conf/**') }}

      - name: Save meta-portfolio sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-portfolio-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-portfolio/**/*.bb', 'layers/meta-portfolio/**/*.bbappend', 'layers/meta-portfolio/**/*.bbclass') }}

      - name: Save meta-security sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-security-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-security/**/*.bb', 'layers/meta-security/**/*.bbappend', 'layers/meta-security/**/*.bbclass') }}

      - name: Save meta-ota sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-ota-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-ota/**/*.bb', 'layers/meta-ota/**/*.bbappend', 'layers/meta-ota/**/*.bbclass') }}
      # ──────────────────────────────────────────────────────────────────────

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp -a out/. artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-images-codespace-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error

      - name: Upload build metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yocto-build-metrics-codespace-${{ github.run_number }}
          path: out/build-summary.txt
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — Remote build on a GitHub-hosted runner (primary CI path).
  #
  # All Yocto build tools come from the pre-built GHCR image
  # (ghcr.io/<owner>/yocto-build-env:latest) — no apt-get at build time.
  # Docker layer cache is managed by publish-build-image.yml.
  # Yocto downloads and sstate are persisted across runs via actions/cache.
  #
  # Prerequisite: ensure-build-image (Job 0 above) guarantees the image exists.
  # ─────────────────────────────────────────────────────────────────────────
  remote-build:
    needs: ensure-build-image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read   # to pull the GHCR image

    steps:
      - name: Free disk space
        # ubuntu-latest runners start with ~14 GB free.
        # Removing unused vendor toolchains recovers ~25 GB for Yocto's tmp/.
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
            /opt/hostedtoolcache/Ruby \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/lib/jvm
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture submodule revision hash
        # Compute before cache restore so the key reflects the exact upstream
        # layer pins (not just whether .gitmodules changed).
        id: sub-hash
        run: |
          echo "rev=$(git submodule status | awk '{print $1}' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Yocto downloads cache
        # DL_DIR: source tarballs fetched by BitBake — rarely change, huge time saver.
        uses: actions/cache@v4
        with:
          path: .cache/yocto/downloads
          key: yocto-dl-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('conf/**') }}
          restore-keys: |
            yocto-dl-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-dl-${{ runner.os }}-

      # ── sstate restore: per-layer keys ────────────────────────────────────
      # All four entries restore into the same SSTATE_DIR.  Because sstate
      # files are content-addressed (unique filenames), the merges are
      # conflict-free.  Splitting the key per layer means a change to one
      # custom layer only busts that layer's key; the other caches still hit.
      - name: Restore upstream sstate cache (poky / meta-oe)
        # Keyed on submodule pins + conf — rarely changes.
        uses: actions/cache/restore@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-upstream-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('conf/**') }}
          restore-keys: |
            yocto-sstate-upstream-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-sstate-upstream-${{ runner.os }}-

      - name: Restore meta-portfolio sstate cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-portfolio-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-portfolio/**/*.bb', 'layers/meta-portfolio/**/*.bbappend', 'layers/meta-portfolio/**/*.bbclass') }}
          restore-keys: |
            yocto-sstate-meta-portfolio-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-sstate-meta-portfolio-${{ runner.os }}-

      - name: Restore meta-security sstate cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-security-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-security/**/*.bb', 'layers/meta-security/**/*.bbappend', 'layers/meta-security/**/*.bbclass') }}
          restore-keys: |
            yocto-sstate-meta-security-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-sstate-meta-security-${{ runner.os }}-

      - name: Restore meta-ota sstate cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-ota-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-ota/**/*.bb', 'layers/meta-ota/**/*.bbappend', 'layers/meta-ota/**/*.bbclass') }}
          restore-keys: |
            yocto-sstate-meta-ota-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-sstate-meta-ota-${{ runner.os }}-
      # ──────────────────────────────────────────────────────────────────────

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Run Yocto build inside GHCR container
        # The workspace is bind-mounted into the container at /workspace.
        # Cache paths (.cache/yocto/downloads and .cache/yocto/sstate-cache)
        # resolve correctly because remote-build.sh derives them from $PWD.
        # BOOTSTRAP_PACKAGES=false skips the apt bootstrap — tools already exist
        # in the image.
        env:
          YOCTO_CENTRAL_CACHE_RSYNC: ${{ secrets.YOCTO_CENTRAL_CACHE_RSYNC }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env BOOTSTRAP_PACKAGES=false \
            --env IMAGE_TARGET="$IMAGE_TARGET" \
            --env CLEAN_BUILD="$CLEAN_BUILD" \
            --env BUILD_VARIANT="${BUILD_VARIANT:-}" \
            --env YOCTO_CENTRAL_CACHE_RSYNC="${YOCTO_CENTRAL_CACHE_RSYNC:-}" \
            ghcr.io/${{ github.repository_owner }}/yocto-build-env:latest \
            bash scripts/remote-build.sh "$IMAGE_TARGET" "$CLEAN_BUILD"

      # ── sstate save: one entry per layer ──────────────────────────────────
      # Explicit saves run even on build failure (partial sstate is valid —
      # BitBake validates each entry independently on the next run).
      # actions/cache/save is a no-op when the key already exists in the
      # cache, so unchanged layers do not produce a new upload.
      - name: Save upstream sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-upstream-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('conf/**') }}

      - name: Save meta-portfolio sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-portfolio-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-portfolio/**/*.bb', 'layers/meta-portfolio/**/*.bbappend', 'layers/meta-portfolio/**/*.bbclass') }}

      - name: Save meta-security sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-security-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-security/**/*.bb', 'layers/meta-security/**/*.bbappend', 'layers/meta-security/**/*.bbclass') }}

      - name: Save meta-ota sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-meta-ota-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('layers/meta-ota/**/*.bb', 'layers/meta-ota/**/*.bbappend', 'layers/meta-ota/**/*.bbclass') }}
      # ──────────────────────────────────────────────────────────────────────

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp -a out/. artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-images-remote-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error

      - name: Upload build metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yocto-build-metrics-remote-${{ github.run_number }}
          path: out/build-summary.txt
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3 — Multi-variant matrix build (debug/release/secure), opt-in.
  #
  # Only runs on manual dispatch with build_all_variants=true, so pushes to
  # main keep building the single default image (fast inner loop). Each
  # variant is a separate DISTRO (layers/meta-portfolio/conf/distro/) — see
  # docs/architecture.md for the feature comparison.
  # ─────────────────────────────────────────────────────────────────────────
  variant-matrix-build:
    needs: ensure-build-image
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_all_variants == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release, secure]
    permissions:
      contents: read
      packages: read # to pull the GHCR image

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
            /opt/hostedtoolcache/Ruby \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/lib/jvm
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture submodule revision hash
        id: sub-hash
        run: |
          echo "rev=$(git submodule status | awk '{print $1}' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Yocto downloads cache
        uses: actions/cache@v4
        with:
          path: .cache/yocto/downloads
          key: yocto-dl-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('conf/**') }}
          restore-keys: |
            yocto-dl-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-dl-${{ runner.os }}-

      - name: Restore ${{ matrix.variant }} sstate cache
        # Keyed per variant since DISTRO/DISTRO_FEATURES differences change
        # task signatures — falls back to the shared upstream cache so
        # poky/meta-oe recipes unaffected by the variant still hit sstate.
        uses: actions/cache/restore@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-variant-${{ matrix.variant }}-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('conf/**', 'layers/meta-portfolio/conf/distro/**') }}
          restore-keys: |
            yocto-sstate-variant-${{ matrix.variant }}-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-
            yocto-sstate-variant-${{ matrix.variant }}-${{ runner.os }}-
            yocto-sstate-upstream-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Build ${{ matrix.variant }} variant inside GHCR container
        env:
          YOCTO_CENTRAL_CACHE_RSYNC: ${{ secrets.YOCTO_CENTRAL_CACHE_RSYNC }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env BOOTSTRAP_PACKAGES=false \
            --env IMAGE_TARGET="$IMAGE_TARGET" \
            --env CLEAN_BUILD=false \
            --env BUILD_VARIANT="${{ matrix.variant }}" \
            --env YOCTO_CENTRAL_CACHE_RSYNC="${YOCTO_CENTRAL_CACHE_RSYNC:-}" \
            ghcr.io/${{ github.repository_owner }}/yocto-build-env:latest \
            bash scripts/remote-build.sh "$IMAGE_TARGET" false

      - name: Save ${{ matrix.variant }} sstate cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/yocto/sstate-cache
          key: yocto-sstate-variant-${{ matrix.variant }}-${{ runner.os }}-${{ steps.sub-hash.outputs.rev }}-${{ hashFiles('conf/**', 'layers/meta-portfolio/conf/distro/**') }}

      - name: Upload ${{ matrix.variant }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-images-${{ matrix.variant }}-${{ github.run_number }}
          path: out/${{ matrix.variant }}
          if-no-files-found: error
