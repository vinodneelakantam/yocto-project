name: Remote Yocto Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image:
        description: "BitBake image target"
        required: false
        default: "core-image-minimal"
      clean:
        description: "Run bitbake -c cleansstate before build"
        required: false
        default: "false"

jobs:
  orchestrate-remote-build:
    # Run orchestration on GitHub-hosted runner while heavy build happens on VPS.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Allow manual overrides from workflow_dispatch; keep safe defaults for push runs.
      IMAGE_TARGET: ${{ github.event.inputs.image || 'core-image-minimal' }}
      CLEAN_BUILD: ${{ github.event.inputs.clean || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required so pinned Yocto sources in sources/ are available.
          submodules: recursive

      - name: Resolve SSH port
        shell: bash
        run: |
          set -euo pipefail
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT//[[:space:]]/}"
          if [[ -z "$PORT" ]]; then
            PORT=22
          fi
          if ! [[ "$PORT" =~ ^[0-9]+$ ]] || (( PORT < 1 || PORT > 65535 )); then
            echo "VPS_PORT must be a numeric SSH port between 1 and 65535."
            exit 1
          fi
          echo "VPS_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          # Create SSH directory with strict permissions for private key usage.
          install -d -m 700 ~/.ssh
          # Inject deploy key from GitHub secret for VPS access.
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Preload host key to avoid interactive trust prompt in CI.
          ssh-keyscan -p "$VPS_PORT" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repository to VPS
        shell: bash
        run: |
          set -euo pipefail
          # Centralize target path so rsync/scp/ssh use the same remote root.
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_BUILD_ROOT || '~/yocto-project' }}"
          # Mirror workspace content to VPS and remove stale files from previous runs.
          # Excluding .git keeps transfer lighter and avoids nested git metadata on VPS.
          rsync -az --delete --exclude='.git' -e "ssh -p $VPS_PORT" ./ "$DEST/"

      - name: Execute remote Yocto build
        shell: bash
        run: |
          set -euo pipefail
          # Execute build on VPS where Yocto has enough CPU/RAM/disk.
          ssh -p "$VPS_PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ secrets.VPS_BUILD_ROOT || '~/yocto-project' }}' && \
             chmod +x scripts/remote-build.sh && \
             scripts/remote-build.sh '$IMAGE_TARGET' '$CLEAN_BUILD'"

      - name: Collect artifacts from VPS
        shell: bash
        run: |
          set -euo pipefail
          # Local staging directory on runner for upload-artifact input.
          mkdir -p artifacts
          # Copy produced build outputs from VPS back to runner.
          scp -P "$VPS_PORT" -r \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_BUILD_ROOT || '~/yocto-project' }}/out/." artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # Keep artifacts per-run for traceability and debugging.
          name: yocto-images-${{ github.run_number }}
          path: artifacts
          # Fail job when expected outputs are missing.
          if-no-files-found: error
