name: Docs Pages Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "apps/**/README.md"
      - "scripts/build-docs-html.sh"
      - "scripts/render-docs-html.py"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build consolidated docs HTML
        run: |
          chmod +x scripts/build-docs-html.sh
          ./scripts/build-docs-html.sh
          touch out/docs-html/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/docs-html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4