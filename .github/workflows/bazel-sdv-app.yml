name: Bazel SDV App

# Fast inner-loop CI for the Bazel-built SDV applications under apps/.
# This is deliberately separate from the heavy Yocto build
# (remote-yocto-build.yml): it builds and tests the C/C++/Python application
# natively on a GitHub-hosted runner in minutes, with no Yocto involvement.

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "libs/**"
      - "tools/**"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - ".bazelignore"
      - ".github/workflows/bazel-sdv-app.yml"
  pull_request:
    paths:
      - "apps/**"
      - "libs/**"
      - "tools/**"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - ".bazelignore"
      - ".github/workflows/bazel-sdv-app.yml"
  workflow_dispatch:

concurrency:
  group: bazel-sdv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Bazel-level build variants, mirroring the Yocto DISTRO variants
        # (portfolio-debug / -release / -secure). See tools/variants and
        # docs/bazel-build-system.md#variant-management.
        variant: [debug, release, secure]
    # Self-hosted remote cache for this job, demonstrating the same gRPC
    # cache protocol used by scripts/bazel-remote-cache.sh locally. See
    # docs/bazel-build-system.md#remote-cache.
    services:
      bazel-remote:
        image: buchgr/bazel-remote-cache:v2.4.3
        ports:
          - 9092:9092
          - 9090:9090
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init SDV app submodule (if configured)
        run: |
          if [[ -f .gitmodules ]] && git config -f .gitmodules --get submodule.apps/sdv-vehicle-service.path >/dev/null 2>&1; then
            git submodule update --init --recursive apps/sdv-vehicle-service
          fi

      # Cache Bazel's repository and disk caches between runs.  This is the
      # Bazel analogue of the Yocto downloads/sstate caches and keeps rebuilds
      # of a growing C++ tree fast.
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', '**/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.variant }}-
            bazel-${{ runner.os }}-

      # Detect whether the apps/ directory contains any Bazel BUILD files.
      # When apps/sdv-vehicle-service is a submodule that points to a repo
      # without Bazel targets (e.g. COVESA/vehicle_signal_specification), the
      # build and test steps must be skipped to avoid a hard CI failure.  The
      # outcome is exposed as the step output `has_targets` so the subsequent
      # steps can gate on it.
      - name: Check for Bazel targets in apps/
        id: check_targets
        run: |
          if find apps -type f \( -name "BUILD.bazel" -o -name "BUILD" \) | grep -q .; then
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            echo "Bazel BUILD files found – build and test will run."
          else
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            echo "No Bazel BUILD files found under apps/. Build and test steps will be skipped."
            echo "This is expected while apps/sdv-vehicle-service points to a repository"
            echo "that does not yet contain Bazel targets."
          fi

      # Bazelisk ships preinstalled on ubuntu-latest runners and honours
      # .bazelversion to fetch the pinned Bazel release. `//...` covers
      # apps/, libs/, and tools/ (build/ and other Yocto trees are excluded
      # via .bazelignore).
      - name: Build SDV application (${{ matrix.variant }})
        if: steps.check_targets.outputs.has_targets == 'true'
        run: bazelisk build --config=ci --config=remote-cache --config=${{ matrix.variant }} //...

      - name: Test SDV application (${{ matrix.variant }})
        if: steps.check_targets.outputs.has_targets == 'true'
        run: bazelisk test --config=ci --config=remote-cache --config=${{ matrix.variant }} //...

      # Informational only: shows the "independent builds" payoff of a
      # cleanly partitioned Bazel graph — only targets that depend on what
      # changed need rebuilding. Non-blocking (change-impact preview, not a
      # gate). See docs/bazel-build-system.md#independent-builds.
      - name: Show affected Bazel targets (informational)
        if: github.event_name == 'pull_request' && matrix.variant == 'release'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          bash scripts/bazel-affected-targets.sh "origin/${{ github.base_ref }}" || true
