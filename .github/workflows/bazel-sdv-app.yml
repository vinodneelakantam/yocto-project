name: Bazel SDV App

# Fast inner-loop CI for the Bazel-built SDV applications under apps/.
# This is deliberately separate from the heavy Yocto build
# (remote-yocto-build.yml): it builds and tests the C/C++/Python application
# natively on a GitHub-hosted runner in minutes, with no Yocto involvement.

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - ".bazelignore"
      - ".github/workflows/bazel-sdv-app.yml"
  pull_request:
    paths:
      - "apps/**"
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - ".bazelignore"
      - ".github/workflows/bazel-sdv-app.yml"
  workflow_dispatch:

concurrency:
  group: bazel-sdv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The SDV application under apps/ is tracked as a Git submodule, so it
          # must be initialised for the Bazel build/test below to see its files.
          submodules: recursive

      # Cache Bazel's repository and disk caches between runs.  This is the
      # Bazel analogue of the Yocto downloads/sstate caches and keeps rebuilds
      # of a growing C++ tree fast.
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'apps/**/BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # Bazelisk ships preinstalled on ubuntu-latest runners and honours
      # .bazelversion to fetch the pinned Bazel release.
      - name: Build SDV application
        run: bazelisk build --config=ci //apps/...

      - name: Test SDV application
        run: bazelisk test --config=ci //apps/...
