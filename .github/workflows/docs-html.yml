name: Docs HTML

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "apps/**/README.md"
      - "scripts/build-docs-html.sh"
      - "scripts/render-docs-html.py"
      - ".github/workflows/docs-html.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "apps/**/README.md"
      - "scripts/build-docs-html.sh"
      - "scripts/render-docs-html.py"
      - ".github/workflows/docs-html.yml"
  workflow_dispatch:

concurrency:
  group: docs-html-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docs-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build consolidated docs HTML
        run: |
          chmod +x scripts/build-docs-html.sh
          ./scripts/build-docs-html.sh

      - name: Upload docs HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: out/docs-html/
          if-no-files-found: error